name: Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon test 2>&1 | tee build.log
      - name: Show build errors
        if: failure()
        shell: bash
        run: |
          # copies the compiler errors into the run's annotations, so they are visible on the run page
          grep -E "^e: |^w: .*error|FAILED|What went wrong|Could not|Unresolved|error:" -A1 build.log | head -60 | sed -e 's/%/%25/g' | while IFS= read -r line; do echo "::error::${line}"; done
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexora-Printer-v1.0.0-debug
          path: app/build/outputs/apk/debug/*.apk
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
